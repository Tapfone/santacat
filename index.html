<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#9b1025">
<title>Santa's Purr-fect Christmas</title>
<style>
:root{--red:#a9162d;--deep:#650d20;--green:#126342;--gold:#ffd77a;--cream:#fff8e9;--ink:#3b2022}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:radial-gradient(circle at top,#fff7e9 0,#f8e9d6 48%,#e9d7c3 100%);font-family:Georgia,"Times New Roman",serif;color:var(--ink)}
.page{width:min(100%,620px);min-height:100vh;margin:auto;background:var(--cream);overflow:hidden;box-shadow:0 0 40px #4a152522;position:relative}
.hero{position:relative;text-align:center;padding:26px 22px 34px;background:linear-gradient(145deg,#8e1028,#bd2338 60%,#6f1025);color:#fff;overflow:hidden}
.hero:before,.hero:after{content:"✦  ❄  ✧  ❄  ✦";position:absolute;color:#ffffff55;font-size:25px;letter-spacing:13px;white-space:nowrap;transform:rotate(-18deg)}
.hero:before{top:34px;left:-40px}.hero:after{bottom:24px;right:-70px}
.pill{display:inline-block;border:1px solid #ffffff77;border-radius:30px;padding:7px 13px;font:700 11px Arial,sans-serif;letter-spacing:2px;text-transform:uppercase}
h1{font-size:clamp(34px,9vw,54px);line-height:1.02;margin:17px 0 8px;text-shadow:0 3px 0 #5d1020}
.subtitle{font:15px/1.5 Arial,sans-serif;color:#ffe8dc;margin:0 auto;max-width:390px}
.cat-wrap{width:min(78%,360px);margin:18px auto 0;background:#fff8e9;border:7px solid #f6d995;border-radius:48% 48% 28px 28px;padding:8px;box-shadow:0 12px 0 #5d102044,0 18px 30px #31071255}
.cat-wrap img{display:block;width:100%;height:auto;border-radius:45% 45% 20px 20px}
.hero-actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:20px}
button,.btn{border:0;border-radius:999px;padding:12px 17px;font-weight:700;font-size:14px;cursor:pointer;transition:transform .15s,filter .15s}
button:hover,.btn:hover{transform:translateY(-2px);filter:brightness(1.06)}
button:active,.btn:active{transform:scale(.97)}
.primary{background:var(--gold);color:#5a1722}.light{background:#fff;color:var(--deep)}.green{background:var(--green);color:white}
main{padding:18px 17px 30px}
.section{background:#fff;border:1px solid #ead9c3;border-radius:22px;padding:20px;margin:0 0 16px;box-shadow:0 5px 16px #5c32100c}
.section h2{margin:0 0 12px;color:var(--deep);font-size:24px}
.kicker{font:700 10px Arial,sans-serif;letter-spacing:2px;text-transform:uppercase;color:#a56c37;margin-bottom:6px}
.countdown{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.timebox{background:#f8eee0;border-radius:14px;padding:12px 4px}
.timebox strong{display:block;font:700 clamp(23px,6vw,32px) Arial,sans-serif;color:var(--red);font-variant-numeric:tabular-nums}
.timebox span{font:10px Arial,sans-serif;letter-spacing:1px;text-transform:uppercase;color:#76564b}
.note{font:13px/1.5 Arial,sans-serif;color:#795e52;text-align:center;margin:12px 0 0}
.speech{background:#fff5df;border-left:5px solid var(--gold);padding:15px;border-radius:12px;font-size:17px;line-height:1.5}
.signature{font-style:italic;text-align:right;color:var(--green);margin:12px 3px 0}
.joke{font-size:19px;line-height:1.45;min-height:64px}
.controls{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}
.trivia-q{font-size:18px;line-height:1.4;margin:6px 0 13px}
.answers{display:grid;gap:8px}
.answer{width:100%;border-radius:12px;text-align:left;background:#f6eee4;color:var(--ink);border:1px solid #ead8c5}
.answer.correct{background:#dff3e6;border-color:#5b9b70}.answer.wrong{background:#ffe4e4;border-color:#c66}
.feedback{font:14px/1.5 Arial,sans-serif;min-height:22px;margin-top:10px;color:#456b4c}
.score{font:700 13px Arial,sans-serif;color:#8b2433;margin-top:8px}
.music-row{display:flex;align-items:center;gap:13px}
.music-icon{font-size:35px}
.music-copy{flex:1;font:13px/1.4 Arial,sans-serif;color:#76564b}
.gallery{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gallery a{display:block;color:var(--deep);text-decoration:none;font:700 12px Arial,sans-serif}
.gallery img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:13px;border:3px solid #f4dfb7;display:block;margin-bottom:6px}
footer{text-align:center;background:#650d20;color:#ffe9cf;padding:22px 15px;font:12px Arial,sans-serif;letter-spacing:1px}
footer strong{display:block;font:italic 18px Georgia,serif;margin-bottom:6px}
.snow{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.snow i{position:absolute;top:-20px;color:#fff;font-style:normal;animation:fall linear infinite;opacity:.8}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
@media(min-width:700px){body{padding:22px 0}.page{border-radius:24px}.hero{border-radius:24px 24px 0 0}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<div class="page">
<div class="snow" id="snow" aria-hidden="true"></div>
